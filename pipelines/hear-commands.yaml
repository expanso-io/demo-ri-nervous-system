# hear-commands: the handheld mic's box. A one-second window of speech arrives
# every quarter second, a small keyword model hears up, down or stop on this
# box, and only the word leaves, as one small message. The voice stays here.
name: hear-commands
description: Hears up, down or stop on the handheld mic and sends the word
type: pipeline
labels:
  demo: demo-ri-nervous-system
  sense: word
selector:
  match_labels:
    demo: demo-ri-nervous-system
    node: hear-commands
config:
  input:
    label: handheld_mic_windows
    http_server:
      address: '127.0.0.1:${RI_WORD_INGEST_PORT:20173}'
      path: /frames
      allowed_verbs: [POST]
  pipeline:
    threads: 1
    processors:
      - label: keywords_on_this_box
        http:
          url: 'http://127.0.0.1:${RI_WORD_DEVICE_PORT:20176}/infer'
          verb: POST
          headers:
            Content-Type: application/octet-stream
          timeout: 5s
          retries: 5
          retry_period: 1s
      - label: model_unreachable
        catch:
          - label: model_unreachable_log
            log:
              level: WARN
              message: 'keyword model did not answer: ${! error() }'
          - label: model_unreachable_skip
            mapping: root = deleted()
      - label: by_outcome
        switch:
          - check: this.sense == null && this.window % 20 == 0
            processors:
              - label: listening_log
                log:
                  level: INFO
                  message: 'listening: window ${! this.window }, heard ${! this.heard }'
              - label: listening_skip
                mapping: root = deleted()
          - check: this.sense == null
            processors:
              - label: nothing_to_send
                mapping: root = deleted()
          - processors:
              - label: word_log
                log:
                  level: INFO
                  message: >-
                    word ${! this.value } ${! this.confidence }
                    seq=${! this.seq } sent to decide
  output:
    label: word_to_decide
    mqtt:
      urls: ['tcp://127.0.0.1:${RI_MQTT_PORT:18021}']
      topic: ri/sense/word
      client_id: hear-commands
      qos: 1
